name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Instalar librerías de Linux (Necesarias para que Flet compile)
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang cmake ninja-build pkg-config libblkid-dev liblzma-dev

      # 2. Instalar Java (Necesario para Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instalar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Instalar Flet y tus requerimientos
      - name: Install App Dependencies
        run: |
          pip install flet
          pip install -r requirements.txt

      # 5. Construir el APK
      # NOTA: Al no instalar Flutter antes, Flet descargará la versión correcta solo.
      # Quitamos el "yes |" porque ya no habrá preguntas de conflicto.
      - name: Build APK
        run: |
          flet build apk --verbose

      # 6. Subir el archivo para descargar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hockey-app-apk
          path: build/apk/app-release.apk
