name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Instalar librerías de Linux necesarias para compilar sin errores de sistema
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang cmake ninja-build pkg-config libblkid-dev liblzma-dev mesa-utils egl-wayland-dev

      # 2. Configurar Java (Requerido para el SDK de Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Instalar Flet y las dependencias de tu proyecto
      - name: Install App Dependencies
        run: |
          pip install flet
          pip install -r requirements.txt

      # 5. Aceptar licencias de Android (Evita que la compilación se detenga)
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 6. Construir el APK
      # Usamos "yes |" para que Flet instale su propia versión de Flutter automáticamente
      - name: Build APK
        run: |
          yes | flet build apk --verbose

      # 7. Subir el APK generado como artefacto para descargar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hockey-app-apk
          path: build/apk/app-release.apk
